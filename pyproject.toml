[project]
name = "fretting-energy-fem-ml-regression-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "avneeshDS", email = "avneeshchaudhary25@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.155.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pathlib>=1.0.1",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "xgboost>=3.4.1",
]

[project.scripts]
fretting-energy-fem-ml-regression-api = "fretting_energy_fem_ml_regression_api:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]
